<!DOCTYPE html>
<html>
<head>
  <title>Colored Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<table class="layout">
  <!-- Top green row -->
  <tr>
    <td colspan="4" class="green"></td>
  </tr>

  <!-- Middle row with 3 colors -->
  <tr>
    <td colspan="2" class="blue"></td>
    <td class="gray"></td>
    <td class="yellow"></td>
  </tr>

  <!-- Bottom empty row -->
  <tr>
    <td colspan="4" class="white"></td>
  </tr>
</table>

</body>
</html>
